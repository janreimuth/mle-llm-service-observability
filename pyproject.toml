[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mle-llm-service-observability"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "httpx>=0.28.1",
    "langfuse>=5.0.4",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "rumdl>=0.3.0",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.rumdl]
disable = ["MD013"]

[tool.rumdl.MD033]
allowed-elements = ["details", "summary"]

[tool.hatch.build.targets.wheel]
packages = ["src/observability_lab"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
